<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

html{
    scroll-behavior:smooth;
}

body{
    background-color:#56c6ef;
    color: aliceblue;
}

.outer{
    background-color:#292931;
    min-height: 600px;
    border-radius:50px;
    margin:90px;
    padding-left:100px;
    padding-top:30px; 
}

/* HEADER */
.header{                 
    display:flex;        
    justify-content:space-between;  
    align-items:center;  
    padding-top: 10px;
}

.navbar{
    display:flex;
    margin-right: 180px;
}

.navbar a{
    text-decoration: none;
    margin-left: 20px;
    color: aliceblue;
}

.navbar a:hover{
    font-size:17px;
    color: #56c6ef;
}

/* CONTENT */
.content{
    margin-top:80px;
}

.container{
    margin-left: 560px;
    margin-top: -150px;
}

.input-boxes{
    display: flex;
    gap:70px;
    margin-bottom: 10px;
}

label{
    display: block;
    margin-bottom: 5px;
}

input, textarea{
    padding:8px;
    border-radius:5px;
    border:none;
    outline:none;
}

h1{
    font-size: 30px;
}

h3{
    margin-bottom: 30px;
}

p{
    margin: 0;
    margin-bottom: 3px;
}

/* BUTTON */
.btn{
    background:#3eabd2;
    color:rgb(51, 50, 50);
    padding:12px 25px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
    transition:0.4s;
}

.btn:hover{
    background:rgb(25, 138, 134);
    color:#56c6ef;
    transform:scale(1.1);
    box-shadow:0 0 5px #56c6ef;
}

/* SUCCESS MESSAGE */
#msg{
    margin-top:15px;
    color:#00ffcc;
    font-weight:bold;
    display:none;
}

/* RESPONSIVE */
@media (max-width:768px){

    .header{
        flex-direction:column;
        text-align:center;
    }

    .navbar{
        flex-direction:column;
        margin-right:0;
        gap:10px;
        margin-top:10px;
    }

    .container,
    .outer{
        margin:20px;
        padding:20px;
        height:auto;
    }

    .container{
        margin-left:0;
        margin-top:20px;
    }

    .content{
        margin-top:30px;
    }
    .input-boxes{
    flex-direction:column;
    gap:15px;
    }
    input,
    textarea{
    width:100%;
    box-sizing:border-box;
    }
}
.dark-mode{
    background-color:#f5f5f5;
    color:#292931;
}

.dark-mode .container{
    background-color:#ffffff;
}

.dark-mode .navbar a{
    color:#292931;
}

.dark-mode .footer{
    background-color:#ffffff;
}
.theme-btn{
    width:30px;
    height:20px;
    margin-top:0;
    margin-left:20px;
    padding:0;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:#3eabd2;
}
    .dark-mode{
    background-color:white;
    color:black;
}

.dark-mode .outer{
    background-color:white;
}

.dark-mode .navbar a,
.dark-mode .logo,
.dark-mode h1,
.dark-mode p,
.dark-mode label{
    color:black !important;
}

.dark-mode .container{
    background-color:white;
}
</style>

<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

<div class="outer">

    <!-- HEADER -->
    <div class="header"> 

        <h2 class="logo">Portfolio</h2>

        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="Skills.html">Skills</a>
            <a href="certificates.html">Certificates</a>
            <a href="Projects.html">Project</a>
            <a href="Contact.html">Contact</a>
            <button id="themeBtn" class="theme-btn" type="button">🌙</button>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content">
        <h1><b style="color:#56c6ef;">Get in Touch</b></h1>
        <h3>I'd like to hear from you!</h3>
        <p>If you have any inquiries or just want to</p>
        <p>say hi, please use the contact form!</p>
    </div>

    <!-- FORM -->
    <form id="contactForm">

        <div class="container">

            <div class="input-boxes">

                <div class="input">
                    <label>First name</label>
                    <input type="text" id="fname" required>
                </div>

                <div class="input">
                    <label>Last name</label>
                    <input type="text" id="lname" required>
                </div>

            </div>

            <label>Email <b style="color:red;">*</b></label>
            <input type="email" id="email" required>

            <label>Message</label>
            <textarea rows="6" cols="46" id="message" required></textarea><br>

            <button type="submit" class="btn"><b>Send</b></button>

            <p id="msg">Message sent successfully ✅</p>

        </div>

    </form>   

</div>

<!-- SCRIPT -->
<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    let fname = document.getElementById("fname").value;
    let lname = document.getElementById("lname").value;
    let email = document.getElementById("email").value;
    let message = document.getElementById("message").value;

    if(fname === "" || lname === "" || email === "" || message === ""){
        alert("Please fill all fields!");
        return;
    }

    document.getElementById("msg").style.display = "block";

    this.reset();
});

const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){
        themeBtn.innerHTML = "☀️";
    }else{
        themeBtn.innerHTML = "🌙";
    }

});
</script>

</body>
</html>
