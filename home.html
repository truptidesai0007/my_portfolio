<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.header{                 
    display:flex;        
    justify-content:space-between;  
    align-items:center;  
    padding-top: 30px;
}

.navbar{
    display:flex;
    margin-right: 180px;
}
.navbar a:hover{
font-size:17px;
color: #56c6ef;

}
.navbar a{
    text-decoration: none;
    margin-left: 20px;
    color: aliceblue;
}

body{
    background-color:#56c6ef;
    color: aliceblue;
}

.container{
    background-color:#292931;
    height: 600px;
    border: 2px;
    border-radius:50px;
    margin:90px;
    padding-left:100px;
    
}
.image{
   display: flex;
   justify-content: center;
   align-items: center;
   box-shadow: 0 0 1px #0ef;
   margin-top: 20px;
}
.hexagon{
    width:280px;
    height:310px;
    background:#0ef;
    clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 2px #0ef;
    margin-top:-390px;
    margin-left:360px;
    transition:0.4s;
}
.hexagon img{
    width:96%;
    height:96%;
    object-fit:contain;
    object-position:center;
    clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
}
h4{
    margin-top: 100px;
}

.logo{
    font-size:22px;
}
button{
    background-color: #14779b;
    border-radius: 20px;
    height: 40px;
    width: 180px;
    margin-top: 20px;
    animation-name: button;
}
.btn{
background:#3eabd2;
color:rgb(51, 50, 50);
padding:12px 25px;
border:none;
border-radius:25px;
cursor:pointer;
font-size:14px;
transition:0.4s;
}
.hexagon:hover{

    box-shadow: #033648;
}
/* animation on hover */
.btn:hover{
background:rgb(25, 138, 134);
color:#56c6ef;
transform:scale(1.1);
box-shadow:0 0 5px #56c6ef;
}
p{
    font-size: 15px;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}
.footer{
    /*height:20px;
    width:400px;
    text-align:center;
    padding:18px;*/
    background:#292931;
    margin-top: 25px;
}

.footer a{
    color:rgb(20, 141, 193);
    font-size:20px;
    margin:10px;
    transition:0.3s;
}

.footer a:hover{
    color:#56c6ef;
}

@media (max-width:768px){

    .header{
        flex-direction:column;
        text-align:center;
    }

    .navbar{
        flex-direction:column;
        margin-right:0;
        gap:10px;
        margin-top:10px;
    }

    .container{
        margin:20px;
        padding:20px;
        height:auto;
    }

    .image{
        justify-content:center;
        margin-top:30px;
    }

    .hexagon{
        width:220px;
        height:250px;
        margin-left:auto;
        margin-right:auto;
        margin-top:20px;
    }

    h4{
        margin-top:30px;
    }

    .footer{
        text-align:center;
    }
}
.dark-mode{
    background-color:#f5f5f5;
    color:#292931;
}

.dark-mode .container{
    background-color:#ffffff;
}

.dark-mode .navbar a{
    color:#292931;
}

.dark-mode .footer{
    background-color:#ffffff;
}
.theme-btn{
    width:30px;
    height:20px;
    margin-top:0;
    margin-left:20px;
    padding:0;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:#3eabd2;
}
</style>
</head>

<body>
<div class="container">

    <div class="header"> 

        <h2 class="logo">Portfolio</h2>

        <div class="navbar">
            <a href="home.html">Home</a>

            <button id="themeBtn" class="theme-btn" type="button">🌙</button>

    </div>
    <h4>Hello , It's Me</h4>
    <h1>Trupti Desai</h1>
    <h3>And I'm a<b style="color:#56c6ef;"> Frontend Developer</b></h3>
    <p>Passionate about building modern and user-friendly web interfaces. </p>
    <p>Always Eager to learn new technologies and improve my skills.</p>
    <a href="Trupti_resume.pdf"><button class="btn"><b>Download Resume</b></button></a>
    <div class="footer">

        <a href="https://wa.me/918806917954"><i class="fa-brands fa-whatsapp"></i></a>

<script>
const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){
        themeBtn.innerHTML = "☀️";
    }else{
        themeBtn.innerHTML = "🌙";
    }

});
</script>

</html>
